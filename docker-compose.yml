services:
  packet-exporter:
    build: .
    network_mode: host
    privileged: true
    restart: unless-stopped
    environment:
      IFACE: ${IFACE:-}
    volumes:
      - /sys/fs/bpf:/sys/fs/bpf
      - /sys/kernel/btf:/sys/kernel/btf:ro
      - ./config.yaml:/config.yaml:ro
    command: ["-config", "/config.yaml", "-listen", ":9435"]

  victoriametrics:
    image: victoriametrics/victoria-metrics:v1.154.1
    network_mode: host
    restart: unless-stopped
    command:
      - -promscrape.config=/etc/vm/scrape.yml
      - -storageDataPath=/vm-data
      - -httpListenAddr=:8428
    volumes:
      - ./deploy/victoriametrics/scrape.yml:/etc/vm/scrape.yml:ro
      - vmdata:/vm-data

  grafana:
    image: grafana/grafana:13.2.4
    restart: unless-stopped
    ports:
      - "3000:3000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_UID: packets
    volumes:
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - victoriametrics

volumes:
  vmdata:
